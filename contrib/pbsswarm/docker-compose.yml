# A 10-"node" PBS cluster on a private docker network, for running PRRTE
# under a real PBS (OpenPBS).  node1 is the server - pbs_server, pbs_sched,
# pbs_comm and its PostgreSQL datastore - and every node, node1 included,
# runs a pbs_mom, so a job can include or exclude the head node.
#
# This is contrib/slurmswarm's compose file with OpenPBS in place of SLURM,
# and it behaves the same way: PRRTE is NOT baked into the image.  build.sh
# compiles your live working tree out-of-tree into the shared build volume,
# which every node mounts read-only at /opt/prte.  So `docker compose up -d`
# must be preceded by a `./build.sh`.  See AGENTS.md.
#
# EVERY global name this harness claims is derived from $PRTE_PBS_SWARM, so
# that two clones on one host can each run their own cluster.  Unset, it is
# "prtepbs".  It is deliberately not the variable either sibling harness uses
# ($PRTE_SWARM, $PRTE_SLURM_SWARM): all three are meant to be drivable from
# one shell.
name: ${PRTE_PBS_SWARM:-prtepbs}swarm

x-node: &node
  image: ${IMAGE:-prte-pbs-swarm:latest}
  networks: [dvm]
  tty: true
  # A real init as PID 1, which reaps.  PBS's init script stops and restarts
  # its daemons by watching their pids, and with a PID 1 that never reaps
  # (`sleep`, or sshd alone) every daemon that exits stays a zombie the
  # script then waits on forever.
  init: true
  volumes:
    - prte-build:/opt/prte:ro
    # The job user's home, shared by every node as a cluster's is: PBS
    # copies a job's output files back into it ($usecp, see
    # node-entrypoint.sh), and pbs-alloc keeps a held allocation's
    # environment there.
    - prte-home:/home/prte
  environment:
    PBS_SWARM_NODES: "node1 node2 node3 node4 node5 node6 node7 node8 node9 node10"

services:
  node1:
    <<: *node
    hostname: node1
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node1
  node2:
    <<: *node
    hostname: node2
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node2
  node3:
    <<: *node
    hostname: node3
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node3
  node4:
    <<: *node
    hostname: node4
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node4
  node5:
    <<: *node
    hostname: node5
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node5
  node6:
    <<: *node
    hostname: node6
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node6
  node7:
    <<: *node
    hostname: node7
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node7
  node8:
    <<: *node
    hostname: node8
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node8
  node9:
    <<: *node
    hostname: node9
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node9
  node10:
    <<: *node
    hostname: node10
    container_name: ${PRTE_PBS_SWARM:-prtepbs}-node10

# Left to compose to name (it becomes <project>_dvm): every node sets
# hostname node<N>, and each user-defined bridge network has its own embedded
# DNS, so two clusters' "node1"s never meet.
networks:
  dvm:
    driver: bridge

volumes:
  # Populated by build.sh and shared, read-only, by every node of THIS
  # cluster; external so the builder container and these services name the
  # same volume.
  prte-build:
    name: ${PRTE_PBS_SWARM:-prtepbs}-build
    external: true
  prte-home:
    name: ${PRTE_PBS_SWARM:-prtepbs}-home
