# gres.conf for the PRRTE real-SLURM test swarm (see slurm.conf).
#
# Two GPUs on node9 and node10, for the cases that check an expander job asks
# for the GPUs its parent had.  Slurm wants a device file per GPU and drops
# one without; these two exist in every container, and with the cgroup
# plugins off nothing ever opens them.
NodeName=node[9-10] Name=gpu File=/dev/null
NodeName=node[9-10] Name=gpu File=/dev/zero
